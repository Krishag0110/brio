name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: controller
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      FDE_DEMO_MODE: "true"
      FDE_INFRASTRUCTURE_COMMITTED_USD: "0"
      WEATHER_TARGET_REPOSITORY: Aarush-Dubey/hackathon-weather
      WEATHER_BASELINE_SHA: ${{ vars.WEATHER_BASELINE_SHA }}
      WEATHER_TARGET_PATH: ${{ github.workspace }}/weather-target
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Validate the immutable public weather baseline
        run: |
          if [[ ! "$WEATHER_BASELINE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Configure WEATHER_BASELINE_SHA as the reviewed 40-character seeded-baseline commit in the separate weather repository. A moving branch or candidate ref is not accepted.'
            exit 1
          fi
      - name: Check out the separate weather repository at the reviewed baseline
        uses: actions/checkout@v4
        with:
          repository: Aarush-Dubey/hackathon-weather
          ref: ${{ env.WEATHER_BASELINE_SHA }}
          ssh-key: ${{ secrets.WEATHER_REPO_READ_SSH_KEY }}
          token: ${{ secrets.WEATHER_REPO_READ_TOKEN || github.token }}
          path: weather-target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the standalone weather dependencies
        run: bun install --cwd "$WEATHER_TARGET_PATH" --frozen-lockfile --ignore-scripts
      - name: Verify the checkout is the configured standalone baseline
        run: |
          weather_actual_sha="$(git -C "$WEATHER_TARGET_PATH" rev-parse HEAD)"
          if [ "$weather_actual_sha" != "$WEATHER_BASELINE_SHA" ]; then
            echo '::error::Weather checkout does not match the configured immutable baseline.'
            exit 1
          fi
          test -f "$WEATHER_TARGET_PATH/lib/temperature.ts"
          test -f "$WEATHER_TARGET_PATH/protected/provenance.json"
      - run: bun run --no-install playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: FDE_NEXT_DIST_DIR=.next-e2e bun run build
      - name: Build the independently versioned weather application
        run: bun run --cwd "$WEATHER_TARGET_PATH" build
      - run: bun run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            controller/artifacts/browser-report
            controller/artifacts/browser-results
            controller/tests/execution/artifacts
          retention-days: 7
