name: Restricted weather coding
on:
  workflow_dispatch:
    inputs:
      build_request_base64:
        description: Signed, current engineer Build request encoded as base64
        required: true
        type: string
      build_request_signature:
        description: HMAC signature from the trusted workflow controller
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: owned-weather-engineering
  cancel-in-progress: false
jobs:
  propose-and-verify:
    # Dispatch this workflow only on the protected controller branch. Candidate code is never its workflow.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: engineering-controller
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify signed checkout scope
        id: scope
        run: node --import tsx workers/engineering/dispatch-preflight.ts
        env:
          BUILD_REQUEST_BASE64: ${{ inputs.build_request_base64 }}
          BUILD_REQUEST_SIGNATURE: ${{ inputs.build_request_signature }}
          ENGINEERING_GRANT_SECRET: ${{ secrets.ENGINEERING_GRANT_SECRET }}
          WEATHER_TARGET_REPOSITORY: ${{ vars.WEATHER_TARGET_REPOSITORY }}
      - name: Require read-only target checkout access
        env:
          WEATHER_REPO_READ_SSH_KEY: ${{ secrets.WEATHER_REPO_READ_SSH_KEY }}
          WEATHER_REPO_READ_TOKEN: ${{ secrets.WEATHER_REPO_READ_TOKEN }}
        run: |
          if [ -z "$WEATHER_REPO_READ_SSH_KEY" ] && [ -z "$WEATHER_REPO_READ_TOKEN" ]; then
            echo '::error::Configure WEATHER_REPO_READ_SSH_KEY as the read-only weather deploy key, or WEATHER_REPO_READ_TOKEN with target contents read access.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.scope.outputs.repository }}
          ref: ${{ steps.scope.outputs.base_sha }}
          path: weather-target
          ssh-key: ${{ secrets.WEATHER_REPO_READ_SSH_KEY }}
          token: ${{ secrets.WEATHER_REPO_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Validate immutable sandbox image and registry configuration
        env:
          CODING_SANDBOX_IMAGE: ${{ vars.CODING_SANDBOX_IMAGE }}
          CODING_SANDBOX_WIF_PROVIDER: ${{ vars.CODING_SANDBOX_WIF_PROVIDER }}
          CODING_SANDBOX_READER_SERVICE_ACCOUNT: ${{ vars.CODING_SANDBOX_READER_SERVICE_ACCOUNT }}
        run: |
          if ! [[ "$CODING_SANDBOX_IMAGE" =~ ^[-a-zA-Z0-9_./:]+@sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::CODING_SANDBOX_IMAGE must contain a reviewed immutable sha256 digest.'
            exit 1
          fi
          if [[ "$CODING_SANDBOX_IMAGE" == *-docker.pkg.dev/* ]] && { [ -z "$CODING_SANDBOX_WIF_PROVIDER" ] || [ -z "$CODING_SANDBOX_READER_SERVICE_ACCOUNT" ]; }; then
            echo '::error::Private Artifact Registry images require the scoped workload identity provider and reader service account variables.'
            exit 1
          fi
      - name: Authenticate only the reviewed sandbox image pull
        id: sandbox-registry-auth
        if: contains(vars.CODING_SANDBOX_IMAGE, '-docker.pkg.dev/')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CODING_SANDBOX_WIF_PROVIDER }}
          service_account: ${{ vars.CODING_SANDBOX_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Load the reviewed immutable sandbox image
        env:
          CODING_SANDBOX_IMAGE: ${{ vars.CODING_SANDBOX_IMAGE }}
          REGISTRY_ACCESS_TOKEN: ${{ steps.sandbox-registry-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mend_docker_config="$(mktemp -d "$RUNNER_TEMP/mend-sandbox-docker.XXXXXX")"
          trap 'rm -rf "$mend_docker_config"' EXIT
          if [[ "$CODING_SANDBOX_IMAGE" == *-docker.pkg.dev/* ]]; then
            printf '%s' "$REGISTRY_ACCESS_TOKEN" | docker --config "$mend_docker_config" login --username oauth2accesstoken --password-stdin "https://${CODING_SANDBOX_IMAGE%%/*}"
          fi
          docker --config "$mend_docker_config" pull "$CODING_SANDBOX_IMAGE"
          # The EXIT trap removes registry credentials before candidate code runs.
      - name: Propose and verify through the budgeted controller
        run: node --import tsx workers/engineering/run-build-cli.ts
        env:
          BUILD_REQUEST_BASE64: ${{ inputs.build_request_base64 }}
          BUILD_REQUEST_SIGNATURE: ${{ inputs.build_request_signature }}
          ENGINEERING_GRANT_SECRET: ${{ secrets.ENGINEERING_GRANT_SECRET }}
          ENGINEERING_CALLBACK_SECRET: ${{ secrets.ENGINEERING_CALLBACK_SECRET }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          CODING_SANDBOX_IMAGE: ${{ vars.CODING_SANDBOX_IMAGE }}
          TARGET_REPOSITORY_DIRECTORY: ${{ github.workspace }}/weather-target
      - name: Preserve only trusted sanitized candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-weather-patch
          path: candidate-output/
          if-no-files-found: ignore
          retention-days: 7
  create-reviewed-pr:
    needs: propose-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: engineering-pr-writer
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: verified-weather-patch
          path: candidate-output
      - name: Require separate PR and protected-check capabilities
        env:
          WEATHER_PR_TOKEN: ${{ secrets.WEATHER_PR_TOKEN }}
          WEATHER_CHECKS_APP_ID: ${{ vars.WEATHER_CHECKS_APP_ID }}
          WEATHER_CHECKS_APP_PRIVATE_KEY: ${{ secrets.WEATHER_CHECKS_APP_PRIVATE_KEY }}
          WEATHER_CHECKS_TOKEN: ${{ secrets.WEATHER_CHECKS_TOKEN }}
        run: |
          if [ -z "$WEATHER_PR_TOKEN" ]; then
            echo '::error::Configure WEATHER_PR_TOKEN with PR/contents write access to the weather repository.'
            exit 1
          fi
          if [ -n "$WEATHER_CHECKS_APP_ID" ]; then
            if [ -z "$WEATHER_CHECKS_APP_PRIVATE_KEY" ]; then
              echo '::error::WEATHER_CHECKS_APP_ID requires WEATHER_CHECKS_APP_PRIVATE_KEY for the installed Checks-write GitHub App.'
              exit 1
            fi
          elif [ -z "$WEATHER_CHECKS_TOKEN" ]; then
            echo '::error::Install a Checks-write GitHub App on hackathon-weather and configure WEATHER_CHECKS_APP_ID and WEATHER_CHECKS_APP_PRIVATE_KEY. WEATHER_CHECKS_TOKEN is an optional supported-token fallback.'
            exit 1
          fi
      - name: Mint a short-lived protected-check token for the weather repository
        id: weather-checks-app
        if: ${{ vars.WEATHER_CHECKS_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WEATHER_CHECKS_APP_ID }}
          private-key: ${{ secrets.WEATHER_CHECKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hackathon-weather
          permission-checks: write
      - name: Authenticate reviewed artifact, write PR and explicitly attach protected check
        run: node --import tsx workers/engineering/write-pr-cli.ts
        env:
          ENGINEERING_CALLBACK_SECRET: ${{ secrets.ENGINEERING_CALLBACK_SECRET }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          GITHUB_PR_TOKEN: ${{ secrets.WEATHER_PR_TOKEN }}
          GITHUB_CHECKS_TOKEN: ${{ steps.weather-checks-app.outputs.token || secrets.WEATHER_CHECKS_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ vars.WEATHER_DEFAULT_BRANCH }}
